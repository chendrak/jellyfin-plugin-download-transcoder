name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: dotnet test Jellyfin.Plugin.DownloadTranscoder.slnx
      - run: dotnet publish Jellyfin.Plugin.DownloadTranscoder -c Release -o out
      - name: Package
        run: |
          mkdir -p dist
          cd out && zip ../dist/download-transcoder.zip Jellyfin.Plugin.DownloadTranscoder.dll
      - uses: actions/upload-artifact@v4
        with:
          name: download-transcoder
          path: dist/download-transcoder.zip
